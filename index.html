<!DOCTYPE html>
<html lang="ja" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>クイズアプリ</title>
    
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container" id="quiz-container">
    <div id="game-ui">
        <div class="timer">残り時間: <span id="time">15</span>秒</div>
        <div class="progress-bar"><div id="progress"></div></div>
        <h2 id="question">読み込み中...</h2>
        <div class="options" id="options"></div>
    </div>

    <div id="result-screen">
        <h2>クイズ終了！</h2>
        <div class="score" id="final-score">0</div>
        <p>正解数です</p>
        <button class="restart-btn" onclick="location.reload()">もう一度挑戦する</button>
    </div>
</div>

<script>
    const quizData = [
        { q: "日本で一番高い山は？", a: ["富士山", "北岳", "奥穂高岳", "槍ヶ岳"], correct: 0 },
        { q: "日本の首都はどこですか？", a: ["大阪", "京都", "東京", "札幌"], correct: 2 },
        { q: "「桃太郎」で、桃から生まれた後に最初に出会った動物は？", a: ["犬", "猿", "キジ", "猫"], correct: 0 },
        { q: "1年は何日ですか？（平年）", a: ["364日", "365日", "366日", "367日"], correct: 1 }
    ];

    let currentIdx = 0;
    let score = 0;
    let timeLeft = 15;
    let timer;

    const questionEl = document.getElementById('question');
    const optionsEl = document.getElementById('options');
    const progressEl = document.getElementById('progress');
    const timeEl = document.getElementById('time');

    function startTimer() {
        timeLeft = 15;
        timeEl.textContent = timeLeft;
        timer = setInterval(() => {
            timeLeft--;
            timeEl.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timer);
                handleAnswer(-1);
            }
        }, 1000);
    }

    function loadQuestion() {
        clearInterval(timer);
        if (currentIdx >= quizData.length) return showResult();
        
        const data = quizData[currentIdx];
        questionEl.textContent = `${currentIdx + 1}. ${data.q}`;
        optionsEl.innerHTML = '';
        progressEl.style.width = `${(currentIdx / quizData.length) * 100}%`;
        
        data.a.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.textContent = opt;
            btn.onclick = () => handleAnswer(i);
            optionsEl.appendChild(btn);
        });
        startTimer();
    }

    function handleAnswer(idx) {
        clearInterval(timer);
        const correct = quizData[currentIdx].correct;
        const btns = optionsEl.querySelectorAll('button');
        
        btns.forEach((b, i) => b.disabled = true);
        
        if (idx === correct) {
            score++;
            btns[idx].classList.add('correct');
        } else {
            if(idx !== -1) btns[idx].classList.add('wrong');
            btns[correct].classList.add('correct');
        }
        
        setTimeout(() => {
            currentIdx++;
            loadQuestion();
        }, 1500);
    }

    function showResult() {
        document.getElementById('game-ui').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').textContent = `${score} / ${quizData.length}`;
    }

    loadQuestion();
</script>
</body>
</html>
